spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  rabbitmq:
    listener:
      simple:
        auto-startup: false

app:
  security:
    api-key: test-key
  messaging:
    queue: payment.events
  payments:
    max-retries: 3
  idempotency:
    ttl: PT24H
